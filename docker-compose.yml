services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: neartar_app_db
      POSTGRES_USER: neartar_app
      POSTGRES_PASSWORD: neartar_app_dev_pw
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neartar_app -d neartar_app_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./server
    env_file: ./server/.env
    environment:
      DATABASE_URL: postgresql+psycopg://neartar_app:neartar_app_dev_pw@db:5432/neartar_app_db
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./client
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
